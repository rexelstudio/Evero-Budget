<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evero Budget — Sign In</title>
    <link rel="stylesheet" href="/css/globals.css">
    <link rel="stylesheet" href="/css/components.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>

<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;">
    <div style="width:100%;max-width:380px;" class="animate-fade-in">
        <div class="flex flex-col items-center mb-6">
            <div class="sidebar-logo mb-4" style="width:40px;height:40px;border-radius:10px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    style="color:hsl(var(--primary-foreground));">
                    <path d="m13 2-2 2.5h3L12 7" />
                    <path d="M10 14v-3" />
                    <path d="M14 14v-3" />
                    <path d="M11 19c-1.7 0-3-1.3-3-3v-2h8v2c0 1.7-1.3 3-3 3Z" />
                    <path d="M12 22v-3" />
                </svg>
            </div>
            <h1 style="font-size:1.375rem;" class="font-bold tracking-tight">Welcome back</h1>
            <p class="text-sm text-muted mt-1">Sign in to your Evero Budget account</p>
        </div>

        <div class="card">
            <div class="card-content" style="padding:24px;">
                <form id="loginForm" class="flex flex-col gap-4">
                    <div class="input-group">
                        <label class="label">Email</label>
                        <input type="email" id="email" class="input" placeholder="name@example.com" required autofocus>
                    </div>
                    <div class="input-group">
                        <label class="label">Password</label>
                        <input type="password" id="password" class="input" placeholder="••••••••" required
                            minlength="8">
                    </div>
                    <button type="submit" id="submitBtn" class="btn btn-default btn-full" style="height:40px;">Sign
                        In</button>
                </form>

                <form id="2faForm" class="flex flex-col gap-4 hidden">
                    <div class="text-center mb-2">
                        <div class="badge badge-secondary mb-2">Security Step</div>
                        <p class="text-sm">Please enter the 6-digit code from your authenticator app</p>
                    </div>
                    <div class="input-group">
                        <label class="label">Authentication Code</label>
                        <input type="text" id="2faCode" class="input text-center" placeholder="000000" maxlength="6"
                            pattern="\d{6}" autofocus>
                    </div>
                    <button type="submit" id="2faBtn" class="btn btn-default btn-full" style="height:40px;">Verify
                        Code</button>
                    <button type="button" class="btn btn-ghost btn-sm" onclick="showLoginForm()">Back to login</button>
                </form>
            </div>
        </div>

        <p class="text-sm text-muted text-center mt-4">Don't have an account? <a href="/signup.html"
                style="color:hsl(var(--foreground));font-weight:500;">Sign up</a></p>
        <div class="flex justify-center gap-4 mt-6">
            <a href="/privacy.html" class="text-xs text-muted" style="text-decoration:underline;">Privacy</a>
            <a href="/terms.html" class="text-xs text-muted" style="text-decoration:underline;">Terms</a>
            <a href="/about.html" class="text-xs text-muted" style="text-decoration:underline;">About</a>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        if (getToken()) window.location.href = '/dashboard.html';

        function showLoginForm() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('2faForm').classList.add('hidden');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.textContent = 'Signing in...';
            try {
                const data = await apiFetch('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password }),
                });

                if (data.status === 'requires_2fa') {
                    document.getElementById('loginForm').classList.add('hidden');
                    document.getElementById('2faForm').classList.remove('hidden');
                    document.getElementById('2faCode').focus();
                    return;
                }

                setToken(data.token); setUser(data.user);
                window.location.href = '/dashboard.html';
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false; btn.textContent = 'Sign In';
            }
        });

        document.getElementById('2faForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const code = document.getElementById('2faCode').value;
            const btn = document.getElementById('2faBtn');
            if (!code) return showToast('Enter code', 'error');

            btn.disabled = true; btn.textContent = 'Verifying...';
            try {
                const data = await apiFetch('/api/auth/verify-2fa', {
                    method: 'POST',
                    body: JSON.stringify({ email, password, code }),
                });
                setToken(data.token); setUser(data.user);
                window.location.href = '/dashboard.html';
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false; btn.textContent = 'Verify Code';
            }
        });
        lucide.createIcons();
    </script>
</body>

</html>
