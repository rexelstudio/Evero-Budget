<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evero Budget — Transactions</title>
    <link rel="stylesheet" href="/css/globals.css">
    <link rel="stylesheet" href="/css/components.css">
</head>

<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="sidebar-logo-icon">⚡</div>
            <div class="sidebar-logo-text">
                <h2>Evero Budget</h2><span>Pro Finance</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="sidebar-nav-title">Menu</div>
            <a href="/dashboard.html" class="sidebar-link"><span class="sidebar-link-icon">📊</span> Dashboard</a>
            <a href="/transactions.html" class="sidebar-link active"><span class="sidebar-link-icon">💳</span>
                Transactions</a>
            <a href="/pricing.html" class="sidebar-link"><span class="sidebar-link-icon">💎</span> Pricing</a>
            <div class="sidebar-nav-title" style="margin-top:12px;">Account</div>
            <a href="/profile.html" class="sidebar-link"><span class="sidebar-link-icon">👤</span> Profile</a>
            <a href="/settings.html" class="sidebar-link"><span class="sidebar-link-icon">⚙️</span> Settings</a>
        </nav>
        <div class="sidebar-user" onclick="window.location.href='/profile.html'">
            <div class="sidebar-avatar" id="sidebarAvatar">U</div>
            <div class="sidebar-user-info">
                <div class="sidebar-user-name" id="sidebarName">User</div>
                <div class="sidebar-user-email" id="sidebarEmail">loading...</div>
            </div>
            <button class="btn-ghost btn-icon" onclick="event.stopPropagation(); logout();" title="Log out"
                style="color:var(--color-text-muted);font-size:1rem;">🚪</button>
        </div>
    </aside>

    <main class="page-content">
        <div class="page-header flex justify-between items-center">
            <div>
                <h1 class="page-title text-gradient">Transactions</h1>
                <p class="text-sm text-muted">View and manage all your financial activity</p>
            </div>
            <div class="flex gap-sm items-center">
                <div id="txLimitBadge" class="hidden badge badge-amber" style="font-size:0.6875rem;">⚡ 0/12 this month
                </div>
                <button class="btn btn-ghost btn-icon" onclick="toggleTheme()">🌙</button>
            </div>
        </div>

        <!-- Warning Banner -->
        <div id="limitWarning" class="hidden"
            style="margin-bottom:16px;padding:16px;border-radius:12px;background:var(--color-amber-light);border:1px solid rgba(245,158,11,0.2);align-items:center;justify-content:space-between;">
            <div class="flex gap-md items-center">
                <div
                    style="width:40px;height:40px;border-radius:12px;background:var(--color-amber-light);display:flex;align-items:center;justify-content:center;font-size:1.25rem;">
                    🔒</div>
                <div>
                    <p style="font-size:0.875rem;font-weight:600;color:var(--color-amber);" id="limitText">Monthly limit
                        reached!</p>
                    <p class="text-xs text-muted">Upgrade to Premium for unlimited transactions</p>
                </div>
            </div>
            <a href="/pricing.html" class="btn btn-sm"
                style="background:linear-gradient(135deg,#f59e0b,#f97316);color:white;">Go Premium</a>
        </div>

        <!-- Filters -->
        <div class="card" style="margin-bottom:24px;">
            <div class="card-body" style="padding:16px;">
                <div class="flex gap-md items-center" style="flex-wrap:wrap;">
                    <input type="text" id="searchInput" class="input" placeholder="🔍  Search transactions..."
                        style="flex:1;min-width:200px;">
                    <select id="filterType" class="input" style="width:140px;">
                        <option value="">All Types</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                    <select id="filterCategory" class="input" style="width:160px;">
                        <option value="">All Categories</option>
                        <option>Food & Dining</option>
                        <option>Transportation</option>
                        <option>Shopping</option>
                        <option>Entertainment</option>
                        <option>Bills & Utilities</option>
                        <option>Health</option>
                        <option>Income</option>
                        <option>Other</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Transaction List -->
        <div class="card">
            <div class="card-body" id="txList">
                <div class="text-center text-muted" style="padding:32px 0;">
                    <div class="spinner" style="margin:0 auto 12px;"></div> Loading...
                </div>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script>
        requireAuth();

        let allTransactions = [];
        let monthlyCount = 0;
        let isPremium = false;

        async function loadTransactions() {
            try {
                const [txData, userInfo] = await Promise.all([
                    apiFetch('/api/transactions'),
                    apiFetch('/api/user'),
                ]);

                allTransactions = txData.transactions;
                monthlyCount = txData.monthly_count;
                isPremium = userInfo.is_premium;

                document.getElementById('sidebarName').textContent = userInfo.name || 'User';
                document.getElementById('sidebarEmail').textContent = userInfo.email;
                document.getElementById('sidebarAvatar').textContent = (userInfo.name || 'U')[0].toUpperCase();

                if (!isPremium) {
                    const badge = document.getElementById('txLimitBadge');
                    badge.classList.remove('hidden');
                    badge.textContent = `⚡ ${monthlyCount}/12 this month`;
                    if (monthlyCount >= 12) badge.classList.replace('badge-amber', 'badge-rose');

                    if (monthlyCount >= 10) {
                        document.getElementById('limitWarning').classList.remove('hidden');
                        document.getElementById('limitWarning').style.display = 'flex';
                        document.getElementById('limitText').textContent = monthlyCount >= 12 ? 'Monthly limit reached!' : `Only ${12 - monthlyCount} transactions left`;
                    }
                }

                renderTransactions(allTransactions);
            } catch (err) {
                showToast('Failed to load transactions', 'error');
            }
        }

        function renderTransactions(txs) {
            const el = document.getElementById('txList');
            if (txs.length === 0) {
                el.innerHTML = '<div class="text-center text-muted" style="padding:48px 0;"><p style="font-size:2.5rem;margin-bottom:12px;">📋</p><h3>No transactions found</h3><p class="text-xs" style="margin-top:4px;">Add your first transaction on the dashboard</p></div>';
                return;
            }
            el.innerHTML = txs.map(t => `
                <div class="tx-row">
                    <div class="tx-info">
                        <div class="tx-desc">${t.description}</div>
                        <div class="tx-meta">${t.category} · ${formatDate(t.date)}</div>
                    </div>
                    <div class="flex gap-sm items-center">
                        <span class="tx-amount ${t.type}">${t.type === 'income' ? '+' : '-'}${formatCurrency(t.amount)}</span>
                        <button class="tx-delete" onclick="deleteTx('${t.id}')" title="Delete">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        async function deleteTx(id) {
            if (!confirm('Delete this transaction?')) return;
            try {
                await apiFetch('/api/transactions?id=' + id, { method: 'DELETE' });
                showToast('Transaction deleted', 'success');
                loadTransactions();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // Filters
        function applyFilters() {
            let filtered = [...allTransactions];
            const search = document.getElementById('searchInput').value.toLowerCase();
            const type = document.getElementById('filterType').value;
            const cat = document.getElementById('filterCategory').value;

            if (search) filtered = filtered.filter(t => t.description.toLowerCase().includes(search) || t.category.toLowerCase().includes(search));
            if (type) filtered = filtered.filter(t => t.type === type);
            if (cat) filtered = filtered.filter(t => t.category === cat);

            renderTransactions(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('filterType').addEventListener('change', applyFilters);
        document.getElementById('filterCategory').addEventListener('change', applyFilters);

        loadTransactions();
    </script>
</body>

</html>
