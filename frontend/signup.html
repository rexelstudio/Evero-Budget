<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evero Budget — Create Account</title>
    <link rel="stylesheet" href="/css/globals.css">
    <link rel="stylesheet" href="/css/components.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>

<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;">
    <div style="width:100%;max-width:380px;" class="animate-fade-in">
        <div class="flex flex-col items-center mb-6">
            <div class="sidebar-logo mb-4" style="width:40px;height:40px;border-radius:10px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    style="color:var(--primary-foreground);">
                    <path d="m13 2-2 2.5h3L12 7" />
                    <path d="M10 14v-3" />
                    <path d="M14 14v-3" />
                    <path d="M11 19c-1.7 0-3-1.3-3-3v-2h8v2c0 1.7-1.3 3-3 3Z" />
                    <path d="M12 22v-3" />
                </svg>
            </div>
            <h1 style="font-size:1.375rem;" class="font-bold tracking-tight">Create an account</h1>
            <p class="text-sm text-muted mt-1">Start tracking your finances for free</p>
        </div>

        <div class="card">
            <div class="card-content" style="padding:24px;">
                <form id="signupForm" class="flex flex-col gap-4">
                    <div class="input-group">
                        <label class="label">Name</label>
                        <input type="text" id="name" class="input" placeholder="Your name" required autofocus>
                    </div>
                    <div class="input-group">
                        <label class="label">Email</label>
                        <input type="email" id="email" class="input" placeholder="name@example.com" required>
                    </div>
                    <div class="input-group">
                        <label class="label">Password</label>
                        <input type="password" id="password" class="input" placeholder="Min 8 characters" required
                            minlength="8">
                    </div>
                    <button type="submit" id="submitBtn" class="btn btn-default btn-full" style="height:40px;">Create
                        Account</button>
                </form>
            </div>
        </div>

        <p class="text-sm text-muted text-center mt-4">Already have an account? <a href="/login.html"
                style="color:var(--foreground);font-weight:500;">Sign in</a></p>
        <div class="flex justify-center gap-4 mt-6">
            <a href="/privacy.html" class="text-xs text-muted" style="text-decoration:underline;">Privacy</a>
            <a href="/terms.html" class="text-xs text-muted" style="text-decoration:underline;">Terms</a>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        if (getToken()) window.location.href = '/dashboard.html';
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.textContent = 'Creating...';
            try {
                const data = await apiFetch('/api/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({
                        name: document.getElementById('name').value,
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                    }),
                });
                setToken(data.token); setUser(data.user);
                window.location.href = '/dashboard.html';
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false; btn.textContent = 'Create Account';
            }
        });
        lucide.createIcons();
    </script>
</body>

</html>
