<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evero Budget — Create Account</title>
    <link rel="stylesheet" href="/css/globals.css">
    <link rel="stylesheet" href="/css/components.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>

<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;">
    <div style="width:100%;max-width:380px;" class="animate-fade-in">
        <div class="flex flex-col items-center mb-6">
            <div class="sidebar-logo mb-4" style="width:40px;height:40px;border-radius:10px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    style="color:var(--primary-foreground);">
                    <path d="m13 2-2 2.5h3L12 7" />
                    <path d="M10 14v-3" />
                    <path d="M14 14v-3" />
                    <path d="M11 19c-1.7 0-3-1.3-3-3v-2h8v2c0 1.7-1.3 3-3 3Z" />
                    <path d="M12 22v-3" />
                </svg>
            </div>
            <h1 style="font-size:1.375rem;" class="font-bold tracking-tight">Create an account</h1>
            <p class="text-sm text-muted mt-1">Start tracking your finances for free</p>
        </div>

        <div class="card">
            <div class="card-content" style="padding:24px;">
                <form id="signupForm" class="flex flex-col gap-4">
                    <div class="input-group">
                        <label class="label">Name</label>
                        <input type="text" id="name" class="input" placeholder="Your name" required autofocus>
                    </div>
                    <div class="input-group">
                        <label class="label">Email</label>
                        <input type="email" id="email" class="input" placeholder="name@example.com" required>
                    </div>
                    <div class="input-group">
                        <label class="label">Password</label>
                        <input type="password" id="password" class="input" placeholder="Min 8 characters" required
                            minlength="8">
                    </div>
                    <button type="submit" id="submitBtn" class="btn btn-default btn-full"
                        style="height:44px; font-weight: 600;">Create
                        Account</button>

                    <div style="display: flex; align-items: center; gap: 12px; margin: 8px 0;">
                        <div style="flex: 1; height: 1px; background: var(--border);"></div>
                        <span
                            style="font-size: 0.75rem; color: var(--muted-foreground); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em;">Or
                            continue with</span>
                        <div style="flex: 1; height: 1px; background: var(--border);"></div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <button type="button" class="btn btn-outline btn-full"
                            style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.875rem;"
                            onclick="showToast('Google Sign-up coming soon!', 'info')">
                            <svg width="18" height="18" viewBox="0 0 24 24">
                                <path
                                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                    fill="#4285F4" />
                                <path
                                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                    fill="#34A853" />
                                <path
                                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                                    fill="#FBBC05" />
                                <path
                                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                    fill="#EA4335" />
                            </svg>
                            Google
                        </button>
                        <button type="button" class="btn btn-outline btn-full"
                            style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.875rem;"
                            onclick="showToast('Facebook Sign-up coming soon!', 'info')">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2">
                                <path
                                    d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
                            </svg>
                            Facebook
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <p class="text-sm text-muted text-center mt-4">Already have an account? <a href="/login.html"
                style="color:var(--foreground);font-weight:500;">Sign in</a></p>
        <div class="flex justify-center gap-4 mt-6">
            <a href="/privacy.html" class="text-xs text-muted" style="text-decoration:underline;">Privacy</a>
            <a href="/terms.html" class="text-xs text-muted" style="text-decoration:underline;">Terms</a>
        </div>
    </div>

    <script src="/js/api.js?v=1.1"></script>
    <script>
        if (getToken()) window.location.href = '/dashboard.html';
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.textContent = 'Creating...';
            try {
                const data = await apiFetch('/api/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({
                        name: document.getElementById('name').value,
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                    }),
                });
                setToken(data.token); setUser(data.user);
                window.location.href = '/dashboard.html';
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false; btn.textContent = 'Create Account';
            }
        });
        lucide.createIcons();
    </script>
</body>

</html>
